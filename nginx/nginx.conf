events {}

http {
    upstream collector_backend {
        server collector-1:8000 max_fails=1 fail_timeout=5s;
        server collector-2:8000 max_fails=1 fail_timeout=5s;
        server collector-3:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name serwer1pk localhost;

        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        location / {
            proxy_pass http://collector_backend;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
