

services:
  # 1. Load Balancer (Nginx) - rozdziela ruch na Collector
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - collector-1
      - collector-2
      - collector-3
  # 2. Usługa Zbierania Logów (FastAPI w Pythonie) - skalowana do 3 instancji
  collector-1:
    build: ./collector
    container_name: collector-1
    hostname: collector-1
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=mysql+pymysql://siem:siempass@db:3306/siemdb
      - JWT_SECRET=super-tajny-klucz-mini-siem-p2
    depends_on:
      - redis
      - db

  collector-2:
    build: ./collector
    container_name: collector-2
    hostname: collector-2
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=mysql+pymysql://siem:siempass@db:3306/siemdb
      - JWT_SECRET=super-tajny-klucz-mini-siem-p2
    depends_on:
      - redis
      - db

  collector-3:
    build: ./collector
    container_name: collector-3
    hostname: collector-3
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=mysql+pymysql://siem:siempass@db:3306/siemdb
      - JWT_SECRET=super-tajny-klucz-mini-siem-p2
    depends_on:
      - redis
      - db
  # 3. Kolejka Komunikatów Redis cashe
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 4. Usługa Analizy i Korelacji (Worker w Pythonie)
  analyzer:
    build: ./analyzer
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=mysql+pymysql://siem:siempass@db:3306/siemdb
    volumes:
      - ./analyzer/firebase:/app/firebase:ro
    depends_on:
      - redis
      - db

  # 5. Baza Danych MySQL
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=siemdb
      - MYSQL_USER=siem
      - MYSQL_PASSWORD=siempass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 6. Monitoring: Prometheus (zbiera metryki)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # 7. Monitoring: Grafana (wykresy i dashboardy)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - db
  # 8. Testyz przeglądarki 
  locust:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./tests:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://nginx:80
    depends_on:
      - nginx


volumes:
  mysql_data:
